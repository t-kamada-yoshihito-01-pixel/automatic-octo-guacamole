<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>いっしょに考えよう</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:22px;background:#f5f7fb;color:#222}
h1{margin-bottom:3px}.lead{margin-top:0;color:#555}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.mode button{background:white;color:#333;border:1px solid #ccd3df}.mode button.active{background:#315efb;color:white}
#chat{background:white;border-radius:16px;padding:16px;min-height:360px;box-shadow:0 2px 10px #0001}.msg{padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.7}.ai{background:#eef4ff;margin-right:15%}.me{background:#e9f7e8;margin-left:15%}
textarea{width:100%;box-sizing:border-box;border:1px solid #ccd3df;border-radius:12px;padding:12px;font-size:16px;resize:vertical;margin-top:14px}#send{margin-top:10px;padding:11px 20px;border:0;border-radius:10px;background:#315efb;color:white;font-size:16px}button:disabled{opacity:.5}.hint{font-size:13px;color:#666}
</style></head>
<body>
<h1>いっしょに考えよう</h1><p class="lead">答えを教えるAIではありません。あなたの考えを聞いて、もっと考えるための質問をします。</p>
<div class="mode"><button class="active" data-mode="探究">探究</button><button data-mode="SDGs">SDGs</button><button data-mode="国語">国語</button><button data-mode="社会">社会</button><button data-mode="算数">算数</button></div>
<div id="chat"><div class="msg ai">こんにちは！😊\nぼくは、答えを教えるのではなく、いっしょに考えるAIです。\n\n今、どんなことを考えていますか？</div></div>
<textarea id="input" rows="4" placeholder="自分の考えを書いてみよう"></textarea><button id="send">送る</button>
<p class="hint">名前・住所・電話番号など、自分や友だちの個人情報は書かないでください。</p>
<script>
let mode='探究';const input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat');
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;});
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
send.onclick=()=>{const text=input.value.trim();if(!text)return;add(text,'me');input.value='';send.disabled=true;google.script.run.withSuccessHandler(r=>{add(r,'ai');send.disabled=false;input.focus();}).withFailureHandler(()=>{add('うまくつながりませんでした。先生に知らせてください。','ai');send.disabled=false;}).askAI(text,mode);};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send.click();});
</script></body></html>
