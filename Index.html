<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>いっしょに考えよう</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#f5f7fb;color:#222}
    h1{margin-bottom:4px}.lead{margin-top:0;color:#555}
    #chat{background:white;border-radius:16px;padding:16px;min-height:360px;box-shadow:0 2px 10px #0001}
    .msg{padding:12px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.7}
    .ai{background:#eef4ff;margin-right:15%}.me{background:#e9f7e8;margin-left:15%}
    textarea{width:100%;box-sizing:border-box;border:1px solid #ccd3df;border-radius:12px;padding:12px;font-size:16px;resize:vertical;margin-top:14px}
    button{margin-top:10px;padding:11px 20px;border:0;border-radius:10px;background:#315efb;color:white;font-size:16px;cursor:pointer}
    button:disabled{opacity:.5}.hint{font-size:13px;color:#666}
  </style>
</head>
<body>
  <h1>いっしょに考えよう</h1>
  <p class="lead">答えを教えるAIではありません。あなたの考えを聞いて、もっと考えるための質問をします。</p>
  <div id="chat"><div class="msg ai">こんにちは！😊
ぼくは、答えを教えるのではなく、いっしょに考えるAIです。

今、どんなことを考えていますか？</div></div>
  <textarea id="input" rows="4" placeholder="自分の考えを書いてみよう"></textarea>
  <button id="send">送る</button>
  <p class="hint">名前・住所・電話番号など、自分や友だちの個人情報は書かないでください。</p>
<script>
const input=document.getElementById('input');
const send=document.getElementById('send');
const chat=document.getElementById('chat');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
send.onclick=async()=>{
  const text=input.value.trim(); if(!text)return;
  add(text,'me'); input.value=''; send.disabled=true;
  try{
    const reply=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).askAI(text));
    add(reply,'ai');
  }catch(e){add('うまくつながりませんでした。先生に知らせてください。','ai');}
  send.disabled=false; input.focus();
};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send.click();});
</script>
</body>
</html>
